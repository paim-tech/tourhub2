services:
  - type: web
    name: tourhub
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: ADMIN_EMAIL
        value: admin@tourhub.app
      # Definidos no painel do Render (não vão para o repositório)
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      # E-mail (recuperação de senha)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
    disk:
      name: tourhub-data
      mountPath: /data
      sizeGB: 1
